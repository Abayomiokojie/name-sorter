# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x, 24.x]

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build --if-present

      - name: Run tests and report coverage
        run: npm run test:coverage

      - name: Verify the installed name-sorter command and both outputs
        shell: bash
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          npm install --prefix "$RUNNER_TEMP/name-sorter-smoke" "$RUNNER_TEMP/name-sorter-1.0.0.tgz" --ignore-scripts --no-audit --no-fund
          npm exec --prefix "$RUNNER_TEMP/name-sorter-smoke" --offline --silent -- name-sorter ./unsorted-names-list.txt > actual-stdout.txt
          diff -u test/fixtures/expected-sorted-names-list.txt actual-stdout.txt
          diff -u test/fixtures/expected-sorted-names-list.txt sorted-names-list.txt
